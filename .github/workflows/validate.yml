name: Validate

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'AUTHORS.md'
      - 'START-CODEX-ORG.md'
      - 'CODEX-ORG-OPERATING-SYSTEM.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'AUTHORS.md'
      - 'START-CODEX-ORG.md'
      - 'CODEX-ORG-OPERATING-SYSTEM.md'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    runs-on: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !github.event.repository.fork && vars.TRUSTED_PUSH_RUNNER_LABEL != '' && vars.TRUSTED_PUSH_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      TRUSTED_PUSH: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !github.event.repository.fork && vars.TRUSTED_PUSH_RUNNER_LABEL != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: env.TRUSTED_PUSH != 'true'
        with:
          python-version: "3.12"
      - name: Prepare pre-provisioned trusted Python
        if: env.TRUSTED_PUSH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          command -v python3.12
          environment="$RUNNER_TEMP/ci-python"
          test ! -e "$environment"
          python3.12 -m venv "$environment"
          echo "$environment/bin" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_tracked_text.py
